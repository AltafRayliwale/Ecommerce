spring.application.name=Ecommerce

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/ecommerce}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

project.image=images/

spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=300000000
spring.ecom.app.jwtCookieName=springBootEcom

frontend.url=${FRONTEND_URL:http://localhost:5173/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images}

stripe.secret.key=${STRIPE_SECRET_KEY:dummy}

paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.base.url=${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}